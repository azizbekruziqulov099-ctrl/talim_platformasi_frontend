    <!-- REV549: «Yangi ko'rinish» tanlovi sahifa chizilmasdan OLDIN qo'llanadi (aks holda eski ko'rinish bir lahza ko'rinib qolardi).
         ?korinish=yangi yoki ?korinish=eski — havola orqali yoqish/o'chirish; tanlov qurilmada saqlanadi. -->
    <script>
      (function () { try {
        var k = (/[?&]korinish=(yangi|eski)\b/.exec(location.search) || [])[1];
        if (k) localStorage.setItem("kb_korinish", k);
        if (localStorage.getItem("kb_korinish") === "yangi") document.documentElement.setAttribute("data-kb-korinish", "yangi");
      } catch (e) {} })();
    </script>

    <!-- REV547: ochilish ekrani. Avval ilova yuklanguncha OQ EKRAN turardi. Endi: logotip + nom + yuklanish chizig'i, ilova
         ochilishi bilan (__kbBootOk) silliq yo'qoladi. Hammasi shu faylning ichida (rasm ham) — internetni kutmasdan darhol chiqadi.
         Ilova ochilmasa ham ekranni to'sib qolmaydi: 12 soniyadan keyin o'zi yopiladi (qotish himoyasi pastda alohida ishlaydi). -->
    <style>
      #kb-ochilish{position:fixed;inset:0;z-index:2147482000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:#f7f8fa;color:#13314f;font:600 17px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .28s ease;
        padding:env(safe-area-inset-top,0) 24px env(safe-area-inset-bottom,0)}
      #kb-ochilish.kb-ketdi{opacity:0;pointer-events:none}
      #kb-ochilish img{width:76px;height:76px;border-radius:20px;box-shadow:0 8px 24px rgba(13,90,94,.22);display:block}
      #kb-ochilish b{font-size:20px;letter-spacing:.2px}
      #kb-ochilish i{display:block;width:min(220px,56vw);height:5px;border-radius:5px;background:#e3e8ef;overflow:hidden;position:relative}
      #kb-ochilish i::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;border-radius:5px;background:#1B4B7A;animation:kb-och 1.15s ease-in-out infinite}
      @keyframes kb-och{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
      @media (prefers-color-scheme:dark){#kb-ochilish{background:#0f1720;color:#e8eef5}#kb-ochilish i{background:#22303f}#kb-ochilish i::after{background:#6fb0ee}}
      @media (prefers-reduced-motion:reduce){#kb-ochilish i::after{animation:none;width:100%;opacity:.5}}
    </style>

    <script>
      (function () {
        var e = document.getElementById("kb-ochilish"); if (!e) return;
        var yop = function () { if (!e) return; var x = e; e = null; x.className = "kb-ketdi"; setTimeout(function () { try { x.parentNode.removeChild(x); } catch (z) {} }, 320); };
        window.__kbOchilishYop = yop;
        // ilova chizilishi bilan (root ichida narsa paydo bo'ldi) — yopamiz; signal kelmasa ham ekran to'silib qolmasin
        try { var r = document.getElementById("root"); new MutationObserver(function (_, o) { if (r.children.length) { o.disconnect(); setTimeout(yop, 120); } }).observe(r, { childList: true }); } catch (z) {}
        setTimeout(yop, 12000);
      })();
    </script>
    <!-- REV441: «oq ekranda qotib qolish»dan himoya. Yangilanishdan keyin telefon eski sahifani ochib, uning fayllari
         serverda yo'q bo'lsa — ilova ishga tushmay oq ekran qolardi. Endi: asosiy fayl yuklanmasa yoki fayllar yuklangandan
         keyin 8 soniyada ilova ochilmasa — kesh tozalanadi va sahifa yangidan ochiladi (2 martagacha); 3-marta service worker ham o'chiriladi. -->
    <script>
      (function () {
        var K = "kb_boot_urinish", tugadi = false;
        function tikla(sabab) {
          if (tugadi) return; tugadi = true;
          var n = 0; try { n = +(sessionStorage.getItem(K) || 0); } catch (e) {}
          if (n >= 3) { korsat(); return; }
          try { sessionStorage.setItem(K, String(n + 1)); } catch (e) {}
          var ishlar = [];
          try { if (window.caches) ishlar.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf("samtm-") === 0; }).map(function (k) { return caches.delete(k); })); })); } catch (e) {}
          try { if (n >= 1 && navigator.serviceWorker) ishlar.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
          var och = function () { var u = location.pathname + "?_kb=" + Date.now() + (location.search.indexOf("hujjat=") > 0 ? "&" + location.search.slice(1) : ""); location.replace(u); };
          Promise.all(ishlar).then(och, och); setTimeout(och, 3000);
        }
        function korsat() {
          var r = document.getElementById("root"); if (!r || r.children.length) return;
          r.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f7f5f0;padding:24px;text-align:center"><div><div style="font-size:44px">🕊️</div><h2 style="margin:10px 0">Sahifa ochilmadi</h2><p style="color:#5b6573">Internet sekin bo‘lishi mumkin. Bir oz kutib, qayta bosing.</p><button onclick="sessionStorage.removeItem(\'kb_boot_urinish\');location.replace(location.pathname+\'?_kb=\'+Date.now())" style="border:0;border-radius:14px;background:#1B4B7A;color:#fff;font:700 16px system-ui;padding:14px 22px">🔄 Qayta ochish</button></div></div>';
        }
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t && t.tagName === "SCRIPT" && /\/assets\//.test(t.src || "")) tikla("skript");
        }, true);
        // vaqt sahifa fayllari to'liq yuklangandan keyin hisoblanadi (sekin internetda yuklanish o'rtasida qayta ochilmasin)
        var soat = 0;
        window.addEventListener("load", function () { soat = setTimeout(function () { var r = document.getElementById("root"); if (!r || !r.children.length) tikla("vaqt"); }, 8000); });
        window.__kbBootOk = function () { clearTimeout(soat); tugadi = true; try { sessionStorage.removeItem(K); } catch (e) {} try { window.__kbOchilishYop && window.__kbOchilishYop(); } catch (e) {} };
      })();
    </script>
