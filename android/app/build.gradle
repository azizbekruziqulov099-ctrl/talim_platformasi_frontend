plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'uz.talimkabutar.app'
    compileSdk 34
    defaultConfig {
        applicationId "uz.talimkabutar.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KABUTAR_KEYSTORE") ?: "kabutar.jks")
            storePassword System.getenv("KABUTAR_KS_PAROL") ?: ""
            keyAlias "kabutar"
            keyPassword System.getenv("KABUTAR_KS_PAROL") ?: ""
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.browser:browser:1.8.0'
}
